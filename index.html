<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタマネ</title>
<style>
 
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#020617;
  color:#e5e7eb;
}
.app{
  max-width:900px;
  margin:0 auto;
  padding:16px;
}
.card{
  background:#020617;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
h1{font-size:20px;margin:0 0 12px;}
label{font-size:14px;display:block;margin-top:8px;}
input{
  width:100%;padding:10px 12px;border-radius:999px;
  border:1px solid #374151;background:#020617;color:#f9fafb;outline:none;
}
button{
  margin-top:12px;
  padding:10px 16px;
  border-radius:999px;
  border:none;
  cursor:pointer;
}
.btn-primary{background:#22c55e;color:#022c22;}
.btn-secondary{background:#111827;color:#e5e7eb;border:1px solid #374151;}
.meta{font-size:12px;color:#9ca3af;margin-top:4px;}
.hidden{display:none;}

.list{margin-top:16px;}
.item{
  border-top:1px solid #1f2937;
  padding:12px 0;
}
.item-title{font-size:15px;font-weight:600;}
.badge{
  display:inline-block;font-size:11px;padding:2px 8px;
  border-radius:999px;margin-right:4px;
}
.badge-not{background:#111827;color:#f97316;}
.badge-sub{background:#052e16;color:#4ade80;}
.badge-over{background:#450a0a;color:#fca5a5;}

/* タブ */
.view-tabs{
  display:inline-flex;
  border-radius:999px;
  padding:2px;
  background:#020617;
  border:1px solid #1f2937;
  margin:8px 0 4px;
}
.tab-btn{
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
  border:none;
  cursor:pointer;
  background:transparent;
  color:#9ca3af;
}
.tab-btn-active{
  background:#22c55e;
  color:#022c22;
}

/* カレンダー */
.calendar-wrapper{
  margin-top:8px;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:12px;
}
.cal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.cal-header-title{font-weight:600;}
.cal-nav-btn{
  background:#111827;
  color:#e5e7eb;              /* ← これを追加（文字色） */
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  border:1px solid #374151;
  cursor:pointer;
}
.cal-nav-btn:hover{
  background:#1f2937;         /* 任意：ホバー時に少し明るく */
}
.cal-nav-btn:active{
  transform: translateY(1px);  /* 任意：押した感 */
}

.cal-weekdays,.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
  font-size:11px;
}
.cal-weekdays div{
  text-align:center;
  padding:4px 0;
  color:#9ca3af;
}
.cal-cell{
  min-height:70px;
  padding:4px;
  border-radius:8px;
  border:1px solid transparent;
  text-align:left;
  font-size:11px;
  position:relative;
  cursor:pointer;
}
.cal-cell-empty{
  cursor:default;
  color:#6b7280;          /* ← 日付が見える色 */
  background:#020617;
}

.cal-cell-day{
  font-size:12px;
  font-weight:600;
  margin-bottom:2px;
}
.cal-cell-hover:hover{
  border-color:#374151;
  background:#020617;
}
.cal-overdue{
  background:rgba(248,113,113,0.07);
}
.cal-submitted{
  background:rgba(74,222,128,0.05);
}
.cal-has{
  background:rgba(245,158,11,0.04);
}
.cal-selected{
  border-color:#22c55e;
  box-shadow:0 0 0 1px rgba(34,197,94,0.4);
}

/* カレンダー内宿題カード */
.cal-hw-list{
  margin-top:2px;
}
.cal-hw{
  border-radius:8px;
  border:1px solid #1f2937;
  background:#020617;
  padding:2px 4px;
  margin-top:2px;
}
.cal-hw-title{
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-hw-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:2px;
}
.cal-hw-status{
  font-size:10px;
  padding:1px 6px;
  border-radius:999px;
}
.cal-hw-status-pending{
  background:#111827;
  color:#f97316;
}
.cal-hw-status-submitted{
  background:#052e16;
  color:#4ade80;
}
.cal-hw-status-overdue{
  background:#450a0a;
  color:#fca5a5;
}
.cal-hw-open{
  margin-top:0;
  padding:2px 8px;
  font-size:10px;
  border-radius:999px;
}
/* =========================
   📱 スマホ用レイアウト調整
   ========================= */
@media (max-width: 768px) {

  body{
    font-size:16px; /* 全体の文字を大きく */
  }

  .app{
    padding:10px;
  }

  .card{
    padding:14px;
    border-radius:12px;
  }

  h1{
    font-size:18px;
  }

  h2{
    font-size:16px;
  }

  label{
    font-size:14px;
  }

  input, select{
    font-size:16px;
    padding:10px 12px; /* 指で押しやすく */
  }

  button{
    font-size:15px;
    padding:10px 14px;
    width:100%;       /* ボタンは横いっぱい */
  }

  .btn-secondary{
    margin-top:10px;
  }

  table{
    font-size:13px;
  }

  th, td{
    padding:8px 6px;
  }

  /* テーブルが横にあふれたらスクロール */
  .table-wrap{
    overflow-x:auto;
  }

}
/* =====================================================
   📅 カレンダー内：提出状態を「色だけ」で表現
   ===================================================== */

.cal-hw-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-left:4px;
}

.cal-hw-dot-pending{ background:#ef4444; }    /* 未提出：赤 */
.cal-hw-dot-overdue{ background:#f59e0b; }    /* 一部未提出：黄 */
.cal-hw-dot-submitted{ background:#3b82f6; }  /* 提出済：青 */


/* =====================================================
   📱 スマホ：カレンダーは縦に伸びてもOK
   ===================================================== */
@media (max-width: 768px) {

  .cal-cell{
    min-height:auto;
    padding:6px 4px;
  }

  .cal-hw{
    display:flex;
    align-items:center;
    gap:4px;
    padding:2px 0;
  }

  .cal-hw-title{
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
  }
}
 /* ===============================
   📱 カレンダー内：2文字表示を横に確保
   =============================== */

@media (max-width: 768px) {

  /* 宿題1件を横並びにする */
  .cal-hw{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
  }

  /* 2文字タイトルを安定表示 */
  .cal-hw-title{
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
}

/* ===============================
   📅 カレンダー：日付セル全体の色
   =============================== */

.cal-overdue{
  background:rgba(239,68,68,0.18);   /* 赤 */
}

.cal-has{
  background:rgba(245,158,11,0.18);  /* 黄 */
}

.cal-submitted{
  background:rgba(59,130,246,0.18);  /* 青 */
}
/* ● ドットを使わない */
.cal-hw-dot{
  display:none !important;
}

</style>
</head>
<body>
<div class="app">

  <!-- ログインカード -->
  <div class="card" id="loginCard">
    <h1>スタマネ</h1>
    <label>生徒ID</label>
    <input id="sid" autocomplete="off" placeholder="例：MK0001">
    <label>パスワード</label>
    <input id="pwd" type="password" autocomplete="off">
    <div class="meta">
      <label style="display:flex;align-items:center;gap:4px;margin-top:4px;">
        <input type="checkbox" id="showPwd" style="width:auto;margin:0;">
        <span>パスワードを表示する</span>
      </label>
    </div>
    <button class="btn-primary" onclick="login()">ログイン</button>
    <div id="loginStatus" class="meta" style="margin-top:4px;"></div>
    <div id="loginError" class="meta" style="color:#fca5a5;margin-top:4px;"></div>
  </div>

  <!-- ポータルカード -->
  <div class="card hidden" id="portalCard">
    <div class="meta" id="studentInfo"></div>

    <!-- タブ -->
    <button class="btn-secondary" onclick="refreshAssignments()">
      🔄 更新
    </button>

    <div class="view-tabs">
      <button id="tabCalendar" class="tab-btn tab-btn-active" type="button">カレンダー表示</button>
      <button id="tabList" class="tab-btn" type="button">一覧表示</button>
    </div>

    <!-- カレンダービュー -->
    <div id="calendarWrapper" class="calendar-wrapper">
      <div class="cal-header">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">＜ 前の月</button>
        <div class="cal-header-title" id="calMonthTitle"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">次の月 ＞</button>
      </div>
      <div class="cal-weekdays">
        <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="meta" id="selectedDateInfo" style="margin-top:8px;"></div>

    <!-- 宿題一覧（カレンダー or 全体） -->
    <div class="list" id="assignmentList"></div>

    <button class="btn-secondary" onclick="logout()">ログアウト</button>
  </div>

</div>

<script>
// ==========================================================
// 1. GASテンプレート変数（Code.gs から埋め込まれる）
// ==========================================================
 function scrollToAssignmentDate(dateStr){
  const list = document.getElementById('assignmentList');
  if(!list) return;

  const items = list.querySelectorAll('.item');
  for(const item of items){
    if(item.textContent.includes(dateStr)){
      item.scrollIntoView({behavior:'smooth',block:'start'});
      break;
    }
  }
}

 function restoreSessionIfExists(){
  const saved = loadSession();
  if(!saved) return;

  currentStudent = saved;
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('portalCard').classList.remove('hidden');

  const name  = saved.name || '';
  const sid   = saved.studentId || '';
  const grade = saved.grade || saved.学年 || '';
  const cls   = saved.class || saved.クラス || '';

  document.getElementById('studentInfo').textContent =
    `${name} さん（ID: ${sid} / 学年: ${grade || '-'} / クラス: ${cls || '-'})`;

  initCalendarState();
  loadAssignments();
}
// ====== A: ログイン保存（PWAで再ログイン不要にする）======
const SESSION_KEY = 'stamane_session_v1';

function saveSession(student){
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(student)); } catch(e){}
}
function loadSession(){
  try {
    const s = localStorage.getItem(SESSION_KEY);
    return s ? JSON.parse(s) : null;
  } catch(e){
    return null;
  }
}
function clearSession(){
  try { localStorage.removeItem(SESSION_KEY); } catch(e){}
}

const GAS_SID  = '<?= studentId ?>';
const GAS_PWD  = '<?= password ?>';
const GAS_AUTO = '<?= auto ?>';

let currentStudent = null;
let allAssignments = [];
let currentYear, currentMonth;
let selectedDateStr = null;
let viewMode = 'calendar'; // 'calendar' or 'list'

// ==========================================================
// 自動入力 & 自動ログイン
// ==========================================================
function autoFill(id, value) {
  const el = document.getElementById(id);
  if (el && value) {
    el.value = value;
  }
}

function autoLoginIfPossible() {
  const sid  = (GAS_SID  || '').trim();
  const pwd  = (GAS_PWD  || '').trim();
  const auto = (GAS_AUTO || '').trim();

  if (auto === '1' && sid && pwd) {
    autoFill('sid', sid);
    autoFill('pwd', pwd);

    const st = document.getElementById('loginStatus');
    st.textContent = '自動ログイン中です。しばらくお待ちください…';

    setTimeout(() => {
      login();
    }, 300);
  }
}

// スクリプト読み込み後すぐに実行（scriptがbody末尾なのでDOMは既にある）
autoLoginIfPossible();

// ==========================================================
// API ベースURL
// ==========================================================
function baseExecUrl(){
  return 'https://script.google.com/macros/s/AKfycbw9wrLj_SgmFusn_8YwMJ_I9b9_36JpMdbGK4fPJpXOXVD-BI844jqXgZBGkbdFjFD2/exec';
}

/********** ログイン **********/
function login(){
  const sid = document.getElementById('sid').value.trim();
  const pwd = document.getElementById('pwd').value.trim();
  const err = document.getElementById('loginError');
  const st  = document.getElementById('loginStatus');
  err.textContent = '';
  st.textContent  = '';

  if(!sid || !pwd){
    err.textContent = 'IDとパスワードを入力してください。';
    return;
  }

  st.textContent = 'ログイン中です。しばらくお待ちください…';

  const url = baseExecUrl()
    + '?api=login&studentId=' + encodeURIComponent(sid)
    + '&password=' + encodeURIComponent(pwd);

  fetch(url)
    .then(r => r.json())
    .then(data => {
      st.textContent = '';
      if(!data.ok){
        err.textContent = data.error || 'ログインに失敗しました。';
        return;
      }
      onLoginSuccess(data.student);
    })
    .catch(e => {
      console.error(e);
      st.textContent = '';
      err.textContent = '通信エラーです。';
    });
}

function onLoginSuccess(student){
  currentStudent = student;
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('portalCard').classList.remove('hidden');

  const name  = student.name      || '';
  const sid   = student.studentId || '';
  const grade = student.grade     || student.学年 || '';
  const cls   = student.class     || student.クラス || '';

  document.getElementById('studentInfo').textContent =
    `${name} さん（ID: ${sid} / 学年: ${grade || '-'} / クラス: ${cls || '-'})`;

  initCalendarState();
  loadAssignments();
  saveSession(student);
}

function logout(){
  clearSession(); // ★ 追加
  currentStudent = null;
  allAssignments = [];
  document.getElementById('sid').value = '';
  document.getElementById('pwd').value = '';
  document.getElementById('loginStatus').textContent = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('portalCard').classList.add('hidden');
  document.getElementById('loginCard').classList.remove('hidden');
  document.getElementById('assignmentList').innerHTML = '';
  document.getElementById('calGrid').innerHTML = '';
  document.getElementById('selectedDateInfo').textContent = '';
}

/********** カレンダー & 宿題 **********/
function initCalendarState(){
  const today = new Date();
  currentYear = today.getFullYear();
  currentMonth = today.getMonth();
  selectedDateStr = null;
}
function loadAssignments(){
  if(!currentStudent) return;

  const list = document.getElementById('assignmentList');
  list.innerHTML = '<div class="meta">読み込み中です…</div>';

  const url = baseExecUrl()
    + '?api=assignments&studentId='
    + encodeURIComponent(currentStudent.studentId);

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if(!data.ok){
        list.innerHTML =
          '<div class="meta">'+(data.error || '読み込みエラーです。')+'</div>';
        return;
      }

      // ① 宿題データ保持
      allAssignments = data.assignments || [];

      // ② カレンダー描画
      renderCalendar();

      // ③ 一覧は必ず全件表示
      viewMode = 'list';
      setTabActive('list');
      renderAssignmentListForDate(null);

      // ④ 説明文
      const info = document.getElementById('selectedDateInfo');
      if(info){
        info.textContent = 'すべての宿題一覧です。';
      }
    })
    .catch(e => {
      console.error(e);
      list.innerHTML = '<div class="meta">読み込みエラーです。</div>';
    });
}


function changeMonth(delta){
  currentMonth += delta;
  if(currentMonth < 0){
    currentMonth = 11;
    currentYear--;
  }else if(currentMonth > 11){
    currentMonth = 0;
    currentYear++;
  }
  selectedDateStr = null;
  renderCalendar();
  if (viewMode === 'calendar') {
    renderAssignmentListForDate(null);
  }
}

function formatDateStr(dt){
  const y = dt.getFullYear();
  const m = ('0'+(dt.getMonth()+1)).slice(-2);
  const d = ('0'+dt.getDate()).slice(-2);
  return `${y}-${m}-${d}`;
}

function renderCalendar(){
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const title = document.getElementById('calMonthTitle');
  title.textContent = `${currentYear}年 ${currentMonth + 1}月`;

  /* =========================
     日付 → 宿題配列 のMap
     ========================= */
  const mapByDate = {};
  (allAssignments || []).forEach(a => {
    if(!a.due) return;
    if(!mapByDate[a.due]) mapByDate[a.due] = [];
    mapByDate[a.due].push(a);
  });

  const firstDay = new Date(currentYear, currentMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

  /* =========================
     月初の空白セル
     ========================= */
  for(let i = 0; i < startWeekday; i++){
    const empty = document.createElement('div');
    empty.className = 'cal-cell cal-cell-empty';
    grid.appendChild(empty);
  }

  const todayStr = formatDateStr(new Date());

  /* =========================
     日付セル本体
     ========================= */
  for(let day = 1; day <= daysInMonth; day++){
    const dateObj = new Date(currentYear, currentMonth, day);
    const dateStr = formatDateStr(dateObj);

    const cell = document.createElement('div');
    cell.className = 'cal-cell';

    /* 日付数字 */
    const dayLabel = document.createElement('div');
    dayLabel.className = 'cal-cell-day';
    dayLabel.textContent = day;
    cell.appendChild(dayLabel);

    const items = mapByDate[dateStr] || [];

    /* =========================
       提出状況による色判定
       ========================= */
    let total = items.length;
    let submitted = 0;

    items.forEach(a => {
      if(a.status === '提出' || a.status === '提出済'){
        submitted++;
      }
    });

    if(total > 0){
      if(submitted === 0){
        cell.classList.add('cal-overdue');     // 全未提出（赤）
      }else if(submitted < total){
        cell.classList.add('cal-has');         // 一部提出（黄）
      }else{
        cell.classList.add('cal-submitted');   // 全提出（青）
      }
    }

    /* =========================
       カレンダー内：2文字表示
       ========================= */
    const listDiv = document.createElement('div');
    listDiv.className = 'cal-hw-list';

    items.forEach(a => {
      const hw = document.createElement('div');
      hw.className = 'cal-hw';

      const titleText = String(a.title || '未');
      const titleSpan = document.createElement('span');
      titleSpan.className = 'cal-hw-title';
      titleSpan.textContent = titleText.slice(0, 2);

      /* クリック → 一覧の該当日付へ */
      titleSpan.addEventListener('click', (e) => {
        e.stopPropagation();
        scrollToAssignmentDate(a.due);
      });

      hw.appendChild(titleSpan);
      listDiv.appendChild(hw);
    });

    if(items.length > 0){
      cell.appendChild(listDiv);
    }

    /* 今日の強調 */
    if(dateStr === todayStr){
      cell.style.outline = '2px solid #22c55e';
    }

    /* 日付セルタップ → 一覧スクロール */
    cell.addEventListener('click', () => {
      scrollToAssignmentDate(dateStr);
    });

    grid.appendChild(cell);
  }
}


function renderAssignmentListForDate(dateStr){
  const list = document.getElementById('assignmentList');
  list.innerHTML = '';

  const info = document.getElementById('selectedDateInfo');

    let items = (allAssignments || []).filter(a => {
    const s = String(a.status || '').trim();
    return s === '' || s === '未提出';
    });
  if (viewMode === 'list') {
    // 一覧表示モード: 全件表示
    info.textContent = '';
    items = items.slice();
  } else {
    // カレンダーモード
    if(dateStr){
      info.textContent = `${dateStr} の宿題一覧です。`;
      items = items.filter(a => a.due === dateStr);
    }else{
      info.textContent = 'すべての宿題一覧です。カレンダーの日付をクリックすると、その日の宿題だけ表示されます。';
    }
  }

  if(!items.length){
    list.innerHTML = '<div class="meta">該当する宿題はありません。</div>';
    return;
  }
items.forEach(a=>{
  const hw = document.createElement('div');
  hw.className = 'cal-hw';

  const t = String(a.title || '(タイトル未設定)');
  const two = t.slice(0, 2);

  // 2文字を「ボタン化」して宿題を開く
  const titleBtn = document.createElement('button');
  titleBtn.type = 'button';
  titleBtn.className = 'cal-hw-title';
  titleBtn.textContent = two;
  titleBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(!a.openUrl){
      alert('URLが設定されていません');
      return;
    }
    window.open(a.openUrl,'_blank');
  });

  hw.appendChild(titleBtn);
  listDiv.appendChild(hw);
});



/********** タブ切り替え **********/
function setTabActive(mode){
  const tabCal  = document.getElementById('tabCalendar');
  const tabList = document.getElementById('tabList');
  if (mode === 'calendar') {
    tabCal.classList.add('tab-btn-active');
    tabList.classList.remove('tab-btn-active');
  } else {
    tabCal.classList.remove('tab-btn-active');
    tabList.classList.add('tab-btn-active');
  }
}

document.getElementById('tabCalendar').addEventListener('click', ()=>{
  viewMode = 'calendar';
  setTabActive('calendar');
  document.getElementById('calendarWrapper').classList.remove('hidden');
  document.getElementById('selectedDateInfo').classList.remove('hidden');
  renderAssignmentListForDate(selectedDateStr);
});

document.getElementById('tabList').addEventListener('click', ()=>{
  viewMode = 'list';
  setTabActive('list');
  document.getElementById('calendarWrapper').classList.add('hidden');
  document.getElementById('selectedDateInfo').classList.add('hidden');
  renderAssignmentListForDate(null);
});
}
/********** パスワード表示切替 **********/
document.getElementById('showPwd').addEventListener('change', (e)=>{
  const pwd = document.getElementById('pwd');
  pwd.type = e.target.checked ? 'text' : 'password';
});
function refreshAssignments(){
  if(!currentStudent) return;
  selectedDateStr = null;
  loadAssignments();
}
// ====== C: 起動時に自動復帰（保存済みならログイン画面を飛ばす）======
(function(){
  const saved = loadSession();
  if(!saved) return;

  currentStudent = saved;

  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('portalCard').classList.remove('hidden');

  const name  = saved.name || '';
  const sid   = saved.studentId || '';
  const grade = saved.grade || saved.学年 || '';
  const cls   = saved.class || saved.クラス || '';

  document.getElementById('studentInfo').textContent =
    `${name} さん（ID: ${sid} / 学年: ${grade || '-'} / クラス: ${cls || '-'})`;

  initCalendarState();
  loadAssignments();
})();
function renderAllAssignments(){
  const list = document.getElementById('assignmentList');
  list.innerHTML = '';
  renderAssignmentListForDate(null);
}


</script>
</body>
</html>
