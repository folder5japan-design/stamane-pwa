<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタマネ</title>

<meta name="theme-color" content="#020617">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#020617;
  color:#e5e7eb;
}
.app{
  max-width:900px;
  margin:0 auto;
  padding:16px;
}
.card{
  background:#020617;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.hidden{display:none}
h1{font-size:20px;margin:0 0 12px}
input{
  width:100%;
  padding:10px 12px;
  border-radius:999px;
  border:1px solid #374151;
  background:#020617;
  color:#f9fafb;
}
button{
  margin-top:10px;
  padding:10px 16px;
  border-radius:999px;
  border:none;
  cursor:pointer;
}
.btn-primary{background:#22c55e;color:#022c22}
.btn-secondary{background:#111827;color:#e5e7eb;border:1px solid #374151}
.meta{font-size:12px;color:#9ca3af}

/* ===== カレンダー ===== */
.calendar-wrapper{
  margin-top:8px;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:12px;
  overflow:hidden;
}
.cal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.cal-weekdays,.cal-row{
  display:flex;
  width:100%;
}
.cal-weekday,.cal-cell{
  width:calc(100% / 7);
  font-size:11px;
}
.cal-weekday{
  text-align:center;
  padding:4px 0;
  color:#9ca3af;
}
.cal-cell{
  min-height:70px;
  padding:4px;
  margin:1px;
  border-radius:8px;
}
.cal-cell-day{
  font-size:12px;
  font-weight:600;
}
.cal-has{background:rgba(245,158,11,0.08)}
.cal-overdue{background:rgba(248,113,113,0.08)}
.cal-submitted{background:rgba(74,222,128,0.05)}
</style>
</head>

<body>
<div class="app">

<!-- ===== ログイン ===== -->
<div class="card" id="loginCard">
  <h1>スタマネ</h1>
  <input id="sid" placeholder="生徒ID">
  <input id="pwd" type="password" placeholder="パスワード">
  <button class="btn-primary" onclick="login()">ログイン</button>
  <div id="loginError" class="meta"></div>
</div>

<!-- ===== ポータル ===== -->
<div class="card hidden" id="portalCard">
  <div class="meta" id="studentInfo"></div>

  <div class="calendar-wrapper">
    <div class="cal-header">
      <button class="btn-secondary" onclick="changeMonth(-1)">＜</button>
      <div id="calTitle"></div>
      <button class="btn-secondary" onclick="changeMonth(1)">＞</button>
    </div>

    <div class="cal-weekdays">
      <div class="cal-weekday">日</div>
      <div class="cal-weekday">月</div>
      <div class="cal-weekday">火</div>
      <div class="cal-weekday">水</div>
      <div class="cal-weekday">木</div>
      <div class="cal-weekday">金</div>
      <div class="cal-weekday">土</div>
    </div>

    <div id="calBody"></div>
  </div>
</div>

</div>

<script>
/* ===== GAS exec URL（確定） ===== */
const API =
'https://script.google.com/macros/s/AKfycbw9wrLj_SgmFusn_8YwMJ_I9b9_36JpMdbGK4fPJpXOXVD-BI844jqXgZBGkbdFjFD2/exec';

let currentYear, currentMonth;
let assignments = [];

/* ===== ログイン ===== */
function login(){
  const sid = document.getElementById('sid').value.trim();
  const pwd = document.getElementById('pwd').value.trim();
  const err = document.getElementById('loginError');
  err.textContent='';

  fetch(`${API}?api=login&studentId=${encodeURIComponent(sid)}&password=${encodeURIComponent(pwd)}`)
    .then(r=>r.json())
    .then(d=>{
      if(!d.ok){ err.textContent='ログイン失敗'; return; }
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('portalCard').classList.remove('hidden');
      document.getElementById('studentInfo').textContent =
        `${d.student.name} さん（ID:${d.student.studentId}）`;
      initCalendar();
      loadAssignments(d.student.studentId);
    })
    .catch(()=>err.textContent='通信エラー');
}

/* ===== 宿題取得 ===== */
function loadAssignments(sid){
  fetch(`${API}?api=assignments&studentId=${encodeURIComponent(sid)}`)
    .then(r=>r.json())
    .then(d=>{
      assignments = d.assignments || [];
      renderCalendar();
    });
}

/* ===== カレンダー ===== */
function initCalendar(){
  const t=new Date();
  currentYear=t.getFullYear();
  currentMonth=t.getMonth();
}
function changeMonth(d){
  currentMonth+=d;
  if(currentMonth<0){currentMonth=11;currentYear--}
  if(currentMonth>11){currentMonth=0;currentYear++}
  renderCalendar();
}
function renderCalendar(){
  document.getElementById('calTitle').textContent =
    `${currentYear}年 ${currentMonth+1}月`;

  const body=document.getElementById('calBody');
  body.innerHTML='';

  const first=new Date(currentYear,currentMonth,1);
  const start=first.getDay();
  const days=new Date(currentYear,currentMonth+1,0).getDate();

  const map={};
  assignments.forEach(a=>{
    if(!a.due)return;
    if(!map[a.due])map[a.due]=[];
    map[a.due].push(a);
  });

  let row=document.createElement('div');
  row.className='cal-row';

  for(let i=0;i<start;i++) row.appendChild(emptyCell());

  for(let d=1;d<=days;d++){
    const date=new Date(currentYear,currentMonth,d);
    const ds=format(date);

    const cell=document.createElement('div');
    cell.className='cal-cell';
    cell.innerHTML=`<div class="cal-cell-day">${d}</div>`;

    const items=map[ds]||[];
    items.forEach(a=>{
      const hw=document.createElement('div');
      hw.style.fontSize='10px';
      hw.textContent=a.title||'宿題';
      if(a.overdue && (!a.status||a.status==='未提出')){
        cell.classList.add('cal-overdue');
      }else if(!a.status||a.status==='未提出'){
        cell.classList.add('cal-has');
      }else{
        cell.classList.add('cal-submitted');
      }
      cell.appendChild(hw);
    });

    row.appendChild(cell);

    if((start+d)%7===0){
      body.appendChild(row);
      row=document.createElement('div');
      row.className='cal-row';
    }
  }
  if(row.children.length) body.appendChild(row);
}
function emptyCell(){
  const c=document.createElement('div');
  c.className='cal-cell';
  return c;
}
function format(d){
  return `${d.getFullYear()}-${('0'+(d.getMonth()+1)).slice(-2)}-${('0'+d.getDate()).slice(-2)}`;
}
</script>
</body>
</html>
