<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタマネ</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#020617;
  color:#e5e7eb;
}
.app{max-width:900px;margin:0 auto;padding:16px}
.card{
  background:#020617;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:16px;
  margin-bottom:12px;
}
.hidden{display:none}
input,button{
  width:100%;
  padding:10px 12px;
  border-radius:999px;
  border:1px solid #374151;
  background:#020617;
  color:#f9fafb;
}
button{
  border:none;
  margin-top:10px;
  background:#22c55e;
  color:#022c22;
  cursor:pointer;
}
.btn-secondary{
  background:#111827;
  color:#e5e7eb;
  border:1px solid #374151;
}
.meta{font-size:13px;color:#9ca3af;margin-top:6px}
label{font-size:14px;display:block;margin-top:10px}
h2{margin:0 0 8px}
</style>
</head>

<body>
<div class="app">

<!-- ログイン -->
<div class="card" id="loginCard">
  <h2>スタマネ</h2>

  <label>生徒ID</label>
  <input id="sid">

  <label>パスワード</label>
  <input id="pwd" type="password">

  <label style="display:flex;align-items:center;gap:6px;margin-top:10px">
    <input type="checkbox" id="rememberLogin" style="width:auto">
    <span>ログイン情報を保存する</span>
  </label>

  <button onclick="login()">ログイン</button>
  <div id="loginError" class="meta" style="color:#fca5a5"></div>
</div>

<!-- ポータル -->
<div class="card hidden" id="portalCard">
  <div id="studentInfo" class="meta"></div>

  <!-- 未提出宿題 -->
  <div id="todoArea"></div>

  <!-- 全部完了メッセージ -->
  <div id="allDoneMessage" class="meta hidden">
    🎉 すべての宿題が完了しています！<br>
    次の予定はカレンダーで確認できます。
    <br><br>
    <button class="btn-secondary" onclick="showCalendar()">
      📅 カレンダーを見る
    </button>
  </div>

  <!-- カレンダー（プレースホルダ） -->
  <div id="calendarArea" class="hidden">
    <div class="meta">📅 カレンダー表示（既存機能をここに統合可能）</div>
    <button class="btn-secondary" onclick="showTodo()">
      ← 宿題一覧に戻る
    </button>
  </div>

  <button class="btn-secondary" onclick="logout()">ログアウト</button>
</div>

</div>

<script>
/* =========================
   設定
========================= */
const API_BASE =
  'https://script.google.com/macros/s/AKfycbw9wrLj_SgmFusn_8YwMJ_I9b9_36JpMdbGK4fPJpXOXVD-BI844jqXgZBGkbdFjFD2/exec';

const SESSION_KEY = 'stamane_session';
const LOGIN_KEY   = 'stamane_login';

/* =========================
   ログイン
========================= */
function login(){
  const sid = sidEl().value.trim();
  const pwd = pwdEl().value.trim();
  loginError().textContent = '';

  if(!sid || !pwd){
    loginError().textContent = 'IDとパスワードを入力してください';
    return;
  }

  fetch(`${API_BASE}?api=login&studentId=${encodeURIComponent(sid)}&password=${encodeURIComponent(pwd)}`)
    .then(r=>r.json())
    .then(d=>{
      if(!d.ok){
        loginError().textContent = d.error || 'ログイン失敗';
        return;
      }
      onLoginSuccess(d.student);
    })
    .catch(()=>{
      loginError().textContent = '通信エラー';
    });
}

function onLoginSuccess(student){
  localStorage.setItem(SESSION_KEY, JSON.stringify(student));

  if(rememberEl().checked){
    localStorage.setItem(LOGIN_KEY, JSON.stringify({
      sid: sidEl().value,
      pwd: pwdEl().value
    }));
  }

  showPortal(student);
  loadAssignments(student.studentId);
}

/* =========================
   宿題取得・表示
========================= */
function loadAssignments(studentId){
  fetch(`${API_BASE}?api=assignments&studentId=${encodeURIComponent(studentId)}`)
    .then(r=>r.json())
    .then(d=>{
      const list = (d.assignments || []).filter(a=>{
        const s = String(a.status||'');
        return s === '' || s === '未提出';
      });

      renderTodo(list);
    });
}

function renderTodo(items){
  todoArea().innerHTML = '';
  calendarArea().classList.add('hidden');

  if(items.length === 0){
    allDoneMsg().classList.remove('hidden');
    return;
  }

  allDoneMsg().classList.add('hidden');

  items.forEach(a=>{
    const div = document.createElement('div');
    div.className = 'meta';
    div.textContent = `・${a.title || '宿題'}`;
    todoArea().appendChild(div);
  });
}

/* =========================
   表示切替
========================= */
function showCalendar(){
  todoArea().innerHTML = '';
  allDoneMsg().classList.add('hidden');
  calendarArea().classList.remove('hidden');
}

function showTodo(){
  calendarArea().classList.add('hidden');
  loadAssignments(JSON.parse(localStorage.getItem(SESSION_KEY)).studentId);
}

/* =========================
   復元
========================= */
function restoreSession(){
  const raw = localStorage.getItem(SESSION_KEY);
  if(!raw) return;
  try{
    const student = JSON.parse(raw);
    showPortal(student);
    loadAssignments(student.studentId);
  }catch(e){}
}

function restoreLoginInput(){
  const raw = localStorage.getItem(LOGIN_KEY);
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    sidEl().value = d.sid || '';
    pwdEl().value = d.pwd || '';
    rememberEl().checked = true;
  }catch(e){}
}

/* =========================
   表示
========================= */
function showPortal(student){
  loginCard().classList.add('hidden');
  portalCard().classList.remove('hidden');
  studentInfo().textContent =
    `${student.name} さん（${student.studentId}）`;
}

function logout(){
  localStorage.removeItem(SESSION_KEY);
  portalCard().classList.add('hidden');
  loginCard().classList.remove('hidden');
}

/* =========================
   DOM
========================= */
const sidEl = ()=>document.getElementById('sid');
const pwdEl = ()=>document.getElementById('pwd');
const rememberEl = ()=>document.getElementById('rememberLogin');
const loginCard = ()=>document.getElementById('loginCard');
const portalCard = ()=>document.getElementById('portalCard');
const studentInfo = ()=>document.getElementById('studentInfo');
const loginError = ()=>document.getElementById('loginError');
const todoArea = ()=>document.getElementById('todoArea');
const allDoneMsg = ()=>document.getElementById('allDoneMessage');
const calendarArea = ()=>document.getElementById('calendarArea');

/* =========================
   起動
========================= */
restoreLoginInput();
restoreSession();

/* =========================
   PWA
========================= */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
