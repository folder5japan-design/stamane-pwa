<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタマネ</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#020617;
  color:#e5e7eb;
}
.app{
  max-width:900px;
  margin:0 auto;
  padding:16px;
}
.card{
  background:#020617;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
h1{font-size:20px;margin:0 0 12px;}
label{font-size:14px;display:block;margin-top:8px;}
input{
  width:100%;padding:10px 12px;border-radius:999px;
  border:1px solid #374151;background:#020617;color:#f9fafb;outline:none;
}
button{
  margin-top:12px;
  padding:10px 16px;
  border-radius:999px;
  border:none;
  cursor:pointer;
}

/* 主要ボタン */
.btn-primary{background:#22c55e;color:#022c22;}
.btn-secondary{background:#111827;color:#e5e7eb;border:1px solid #374151;}

.meta{font-size:12px;color:#9ca3af;margin-top:4px;}
.hidden{display:none;}

.list{margin-top:16px;}
.item{
  border-top:1px solid #1f2937;
  padding:12px 0;
}
.item-title{font-size:15px;font-weight:600;}
.badge{
  display:inline-block;font-size:11px;padding:2px 8px;
  border-radius:999px;margin-right:6px;border:1px solid rgba(255,255,255,.08);
}
.badge-not{background:#2a0b0b;color:#fecaca;}     /* 未提出（一覧用） */
.badge-sub{background:#0b1a35;color:#bfdbfe;}     /* 提出済（一覧用） */
.badge-over{background:#2a1a00;color:#fde68a;}    /* 期限切れ（一覧用） */

/* =========================
   タブ（残す）
   ========================= */
.view-tabs{
  display:inline-flex;
  border-radius:999px;
  padding:2px;
  background:#020617;
  border:1px solid #1f2937;
  margin:8px 0 4px;
}
.tab-btn{
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
  border:none;
  cursor:pointer;
  background:transparent;
  color:#9ca3af;
  margin-top:0;
}
.tab-btn-active{
  background:#22c55e;
  color:#022c22;
}

/* =========================
   カレンダー
   ========================= */
.calendar-wrapper{
  margin-top:8px;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:12px;
}
.cal-header{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}
.cal-header-title{
  font-weight:700;
  flex:1;
  text-align:center;
  white-space:nowrap;          /* ✅ 1行固定 */
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-nav-btn{
  background:#111827;
  color:#e5e7eb;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  border:1px solid #374151;
  cursor:pointer;
  margin-top:0;
  white-space:nowrap;
}
.cal-weekdays,.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
  font-size:11px;
}
.cal-weekdays div{
  text-align:center;
  padding:4px 0;
  color:#9ca3af;
}
.cal-cell{
  min-height:64px;
  padding:6px 6px 8px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.06);
  text-align:left;
  font-size:11px;
  position:relative;
  cursor:pointer;
  background:#020617;
}
.cal-cell-empty{
  cursor:default;
  color:#6b7280;
  background:#020617;
  border-color:transparent;
}
.cal-cell-day{
  font-size:12px;
  font-weight:800;
  margin-bottom:4px;
}

/* ✅ 日付セル全体の色：全未提出=赤 / 一部=黄 / 全提出=青 */
.cal-all-pending{
  background:rgba(239,68,68,0.16);   /* 日付セル赤（薄め） */
}
.cal-partial{
  background:rgba(245,158,11,0.16);  /* 日付セル黄（薄め） */
}
.cal-all-submitted{
  background:rgba(59,130,246,0.16);  /* 日付セル青（薄め） */
}

/* カレンダー内2文字バッジ（小さく） */
.cal-hw-list{display:flex;flex-wrap:wrap;gap:4px;}
.cal-hw{display:inline-flex;align-items:center;gap:4px;margin:0;}
.cal-hw-title{
  margin:0;
  padding:3px 8px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  background:#0b1220;
  color:#e5e7eb;
  font-size:11px;
  font-weight:800;
  line-height:1;
  cursor:pointer;
}

/* ✅ 宿題バッジ色：未提出=赤 / 提出=青 / 期限切れ=橙 */
.cal-hw-title.pending{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.35);color:#fecaca;}
.cal-hw-title.submitted{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.35);color:#bfdbfe;}
.cal-hw-title.overdue{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.35);color:#fde68a;}

/* 今日の枠 */
.cal-today{
  outline:2px solid rgba(34,197,94,.7);
  outline-offset:1px;
}

/* =========================
   一覧：日付見出し
   ========================= */
.date-section{
  margin-top:14px;
  padding-top:10px;
  border-top:1px solid #1f2937;
}
.date-title{
  font-weight:800;
  font-size:13px;
  color:#e5e7eb;
  margin-bottom:8px;
}
.small-note{font-size:12px;color:#9ca3af;margin-top:6px}

/* =========================
   📱 スマホ調整
   ========================= */
@media (max-width: 768px) {
  body{font-size:16px;}
  .app{padding:10px;}
  .card{padding:14px;border-radius:12px;}
  h1{font-size:18px;}

  input{font-size:16px;padding:10px 12px;}

  /* ✅ “全ボタンが100%” をやめる（これが崩れの原因になりがち） */
  .btn-primary,.btn-secondary{width:100%;font-size:15px;padding:10px 14px;}

  .calendar-wrapper{padding:10px;}
  .cal-header-title{font-size:13px;}
  .cal-nav-btn{padding:6px 8px;font-size:12px;}
  .cal-cell{min-height:54px;padding:6px 5px 8px;}
  .cal-cell-day{font-size:12px;}
  .cal-hw-title{font-size:11px;padding:3px 7px;}
}
</style>
</head>

<body>
<div class="app">

  <!-- ログインカード -->
  <div class="card" id="loginCard">
    <h1>スタマネ</h1>
    <label>生徒ID</label>
    <input id="sid" autocomplete="off" placeholder="例：MK0001">
    <label>パスワード</label>
    <input id="pwd" type="password" autocomplete="off">
    <div class="meta">
      <label style="display:flex;align-items:center;gap:6px;margin-top:6px;">
        <input type="checkbox" id="showPwd" style="width:auto;margin:0;">
        <span>パスワードを表示する</span>
      </label>
    </div>
    <button class="btn-primary" onclick="login()">ログイン</button>
    <div id="loginStatus" class="meta" style="margin-top:6px;"></div>
    <div id="loginError" class="meta" style="color:#fca5a5;margin-top:6px;"></div>
  </div>

  <!-- ポータルカード -->
  <div class="card hidden" id="portalCard">
    <div class="meta" id="studentInfo"></div>

    <button class="btn-secondary" onclick="refreshAssignments()">🔄 更新</button>

    <!-- タブ：Calendarは「カレンダー＋一覧」、Listは「一覧だけ」 -->
    <div class="view-tabs">
      <button id="tabCalendar" class="tab-btn tab-btn-active" type="button">カレンダー</button>
      <button id="tabList" class="tab-btn" type="button">一覧のみ</button>
    </div>

    <!-- カレンダー -->
    <div id="calendarWrapper" class="calendar-wrapper">
      <div class="cal-header">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">＜ 前</button>
        <div class="cal-header-title" id="calMonthTitle"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">次 ＞</button>
      </div>
      <div class="cal-weekdays">
        <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="small-note">※ 日付をタップすると、下の一覧の該当日付まで移動します。</div>
    </div>

    <div class="meta" id="selectedDateInfo" style="margin-top:10px;"></div>

    <!-- 宿題一覧 -->
    <div class="list" id="assignmentList"></div>

    <button class="btn-secondary" onclick="logout()">ログアウト</button>
  </div>

</div>

<script>
/* ==========================================================
   0) 設定
   ========================================================== */
function baseExecUrl(){
  return 'https://script.google.com/macros/s/AKfycbw9wrLj_SgmFusn_8YwMJ_I9b9_36JpMdbGK4fPJpXOXVD-BI844jqXgZBGkbdFjFD2/exec';
}

/* ==========================================================
   1) セッション保存（PWAで再ログイン不要）
   ========================================================== */
const SESSION_KEY = 'stamane_session_v1';

function saveSession(student){
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(student)); } catch(e){}
}
function loadSession(){
  try {
    const s = localStorage.getItem(SESSION_KEY);
    return s ? JSON.parse(s) : null;
  } catch(e){
    return null;
  }
}
function clearSession(){
  try { localStorage.removeItem(SESSION_KEY); } catch(e){}
}

/* ==========================================================
   2) 状態
   ========================================================== */
let currentStudent = null;
let allAssignments = [];
let currentYear, currentMonth;
let viewMode = 'calendar'; // 'calendar' or 'listOnly'

/* ==========================================================
   3) 便利関数
   ========================================================== */
function formatDateStr(dt){
  const y = dt.getFullYear();
  const m = ('0'+(dt.getMonth()+1)).slice(-2);
  const d = ('0'+dt.getDate()).slice(-2);
  return `${y}-${m}-${d}`;
}

function getStatusClass(a){
  const s = String(a.status || '').trim();
  const overdue = !!a.overdue;
  if (overdue && (s === '' || s === '未提出')) return 'overdue';
  if (s === '提出' || s === '提出済') return 'submitted';
  return 'pending';
}

/* ✅ “日付タップで一覧の該当日付へ” */
function scrollToAssignmentDate(dateStr){
  const el = document.getElementById('date-' + dateStr);
  if(el){
    el.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

/* ==========================================================
   4) ログイン
   ========================================================== */
function login(){
  const sid = document.getElementById('sid').value.trim();
  const pwd = document.getElementById('pwd').value.trim();
  const err = document.getElementById('loginError');
  const st  = document.getElementById('loginStatus');
  err.textContent = '';
  st.textContent  = '';

  if(!sid || !pwd){
    err.textContent = 'IDとパスワードを入力してください。';
    return;
  }

  st.textContent = 'ログイン中です…';

  const url = baseExecUrl()
    + '?api=login&studentId=' + encodeURIComponent(sid)
    + '&password=' + encodeURIComponent(pwd);

  fetch(url)
    .then(r => r.json())
    .then(data => {
      st.textContent = '';
      if(!data.ok){
        err.textContent = data.error || 'ログインに失敗しました。';
        return;
      }
      onLoginSuccess(data.student);
    })
    .catch(e => {
      console.error(e);
      st.textContent = '';
      err.textContent = '通信エラーです。';
    });
}

function onLoginSuccess(student){
  currentStudent = student;

  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('portalCard').classList.remove('hidden');

  const name  = student.name      || '';
  const sid   = student.studentId || '';
  const grade = student.grade     || student.学年 || '';
  const cls   = student.class     || student.クラス || '';

  document.getElementById('studentInfo').textContent =
    `${name} さん（ID: ${sid} / 学年: ${grade || '-'} / クラス: ${cls || '-'})`;

  saveSession(student);
  initCalendarState();
  loadAssignments();
}

function logout(){
  clearSession();
  currentStudent = null;
  allAssignments = [];

  document.getElementById('sid').value = '';
  document.getElementById('pwd').value = '';
  document.getElementById('loginStatus').textContent = '';
  document.getElementById('loginError').textContent = '';

  document.getElementById('portalCard').classList.add('hidden');
  document.getElementById('loginCard').classList.remove('hidden');
  document.getElementById('assignmentList').innerHTML = '';
  document.getElementById('calGrid').innerHTML = '';
  document.getElementById('selectedDateInfo').textContent = '';
}

/* ==========================================================
   5) カレンダー初期化
   ========================================================== */
function initCalendarState(){
  const today = new Date();
  currentYear = today.getFullYear();
  currentMonth = today.getMonth();
}

function changeMonth(delta){
  currentMonth += delta;
  if(currentMonth < 0){
    currentMonth = 11;
    currentYear--;
  }else if(currentMonth > 11){
    currentMonth = 0;
    currentYear++;
  }
  renderCalendar();
}

/* ==========================================================
   6) 宿題読み込み（読み込みエラー対策を強化）
   ========================================================== */
function loadAssignments(){
  if(!currentStudent) return;

  const list = document.getElementById('assignmentList');
  list.innerHTML = '<div class="meta">読み込み中です…</div>';

  const url = baseExecUrl()
    + '?api=assignments&studentId='
    + encodeURIComponent(currentStudent.studentId);

  fetch(url)
    .then(async (r) => {
      const text = await r.text();
      try {
        return JSON.parse(text);
      } catch(e){
        // ✅ JSONじゃない（HTMLが返ってきた等）場合でも「原因表示」して止まらない
        return { ok:false, error:'JSON解析に失敗しました（APIの返りがJSONではない）', raw:text.slice(0,200) };
      }
    })
    .then(data => {
      if(!data.ok){
        const raw = data.raw ? `<div class="meta" style="margin-top:6px;white-space:pre-wrap;opacity:.8">${escapeHtml(data.raw)}</div>` : '';
        list.innerHTML = `<div class="meta">${escapeHtml(data.error || '読み込みエラーです。')}</div>${raw}`;
        return;
      }

      allAssignments = Array.isArray(data.assignments) ? data.assignments : [];

      renderCalendar();
      renderAssignmentListAll();  // ✅ 一覧は常に全件表示（消さない）

      const info = document.getElementById('selectedDateInfo');
      info.textContent = 'すべての宿題一覧です。';
    })
    .catch(e => {
      console.error(e);
      list.innerHTML = '<div class="meta">読み込みエラーです。</div>';
    });
}

function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, (m) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

/* ==========================================================
   7) カレンダー描画（完全差し替え）
   - 日付セル色：全未提出=赤 / 一部=黄 / 全提出=青
   - 宿題は2文字バッジ（小さく）
   - 日付タップ：一覧の該当日付へスクロール（一覧は消さない）
   - 2文字タップ：openUrlへ（※ここは要望通り）
   ========================================================== */
function renderCalendar(){
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const title = document.getElementById('calMonthTitle');
  title.textContent = `${currentYear}年 ${currentMonth + 1}月`;

  // due -> list
  const mapByDate = {};
  (allAssignments || []).forEach(a => {
    const due = String(a.due || '').trim();
    if(!due) return;
    if(!mapByDate[due]) mapByDate[due] = [];
    mapByDate[due].push(a);
  });

  const firstDay = new Date(currentYear, currentMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const todayStr = formatDateStr(new Date());

  // 空白
  for(let i = 0; i < startWeekday; i++){
    const empty = document.createElement('div');
    empty.className = 'cal-cell cal-cell-empty';
    grid.appendChild(empty);
  }

  // 日付セル
  for(let day = 1; day <= daysInMonth; day++){
    const dateObj = new Date(currentYear, currentMonth, day);
    const dateStr = formatDateStr(dateObj);

    const cell = document.createElement('div');
    cell.className = 'cal-cell';

    const dayLabel = document.createElement('div');
    dayLabel.className = 'cal-cell-day';
    dayLabel.textContent = day;
    cell.appendChild(dayLabel);

    const items = mapByDate[dateStr] || [];

    // ✅ 日付セル全体の色判定
    if(items.length > 0){
      const total = items.length;
      const submitted = items.filter(a => {
        const s = String(a.status || '').trim();
        return (s === '提出' || s === '提出済');
      }).length;

      if(submitted === 0){
        cell.classList.add('cal-all-pending');
      }else if(submitted < total){
        cell.classList.add('cal-partial');
      }else{
        cell.classList.add('cal-all-submitted');
      }

      // 2文字バッジ
      const listDiv = document.createElement('div');
      listDiv.className = 'cal-hw-list';

      items.forEach(a => {
        const hw = document.createElement('div');
        hw.className = 'cal-hw';

        const t = String(a.title || '未');
        const badge = document.createElement('button');
        badge.type = 'button';
        badge.className = 'cal-hw-title ' + getStatusClass(a);
        badge.textContent = t.slice(0, 2);

        // ✅ 2文字タップ：その宿題を開く（要望）
        badge.addEventListener('click', (e) => {
          e.stopPropagation();
          if(a.openUrl){
            window.open(a.openUrl, '_blank');
          }else{
            alert('URLが設定されていません');
          }
        });

        hw.appendChild(badge);
        listDiv.appendChild(hw);
      });

      cell.appendChild(listDiv);
    }

    // 今日
    if(dateStr === todayStr){
      cell.classList.add('cal-today');
    }

    // ✅ 日付セルタップ：一覧の該当日付へスクロール（一覧は消さない）
    cell.addEventListener('click', () => {
      // 一覧のみモードでも見えるように、必要ならタブをcalendarに戻す
      scrollToAssignmentDate(dateStr);
    });

    grid.appendChild(cell);
  }
}

/* ==========================================================
   8) 一覧描画（常に全件、日付見出しつき）
   - ここで “一覧が消える/その日だけ” を完全に排除
   ========================================================== */
function renderAssignmentListAll(){
  const list = document.getElementById('assignmentList');
  list.innerHTML = '';

  // dueでグルーピング（dueなしも入れる）
  const groups = {};
  (allAssignments || []).forEach(a => {
    const due = String(a.due || '').trim() || '未設定';
    if(!groups[due]) groups[due] = [];
    groups[due].push(a);
  });

  const keys = Object.keys(groups).sort((a,b) => {
    if(a === '未設定') return 1;
    if(b === '未設定') return -1;
    return a.localeCompare(b);
  });

  if(keys.length === 0){
    list.innerHTML = '<div class="meta">宿題がありません。</div>';
    return;
  }

  keys.forEach(due => {
    const section = document.createElement('div');
    section.className = 'date-section';
    if(due !== '未設定'){
      section.id = 'date-' + due; // ✅ 日付スクロール先
    }

    const dt = document.createElement('div');
    dt.className = 'date-title';
    dt.textContent = (due === '未設定') ? '期限未設定' : due;
    section.appendChild(dt);

    groups[due].forEach(a => {
      const div = document.createElement('div');
      div.className = 'item';

      const title = document.createElement('div');
      title.className = 'item-title';
      title.textContent = a.title || '(タイトル未設定)';
      div.appendChild(title);

      // ステータス表示（小さく）
      const meta = document.createElement('div');
      meta.className = 'meta';

      const sClass = getStatusClass(a);
      const badge = document.createElement('span');
      badge.className = 'badge ' + (sClass === 'submitted' ? 'badge-sub' : (sClass === 'overdue' ? 'badge-over' : 'badge-not'));
      badge.textContent = (sClass === 'submitted') ? '提出済' : (sClass === 'overdue' ? '期限切れ' : '未提出');
      meta.appendChild(badge);

      if(a.points != null){
        const sp = document.createElement('span');
        sp.textContent = `ポイント: ${a.points}`;
        meta.appendChild(sp);
      }
      div.appendChild(meta);

      // ✅ 一覧のボタン：宿題を開く（ここはそのままでOK）
      const btn = document.createElement('button');
      btn.className = 'btn-primary';
      btn.textContent = '宿題を開く';
      btn.type = 'button';
      btn.onclick = () => {
        if(a.openUrl){
          window.open(a.openUrl,'_blank');
        }else{
          alert('URLが設定されていません');
        }
      };
      div.appendChild(btn);

      // LINEメモ等
      if(a.lineNote){
        const ln = document.createElement('div');
        ln.className = 'meta';
        ln.textContent = a.lineNote;
        div.appendChild(ln);
      }

      section.appendChild(div);
    });

    list.appendChild(section);
  });
}

/* ==========================================================
   9) タブ切替
   - Calendar: カレンダー＋一覧
   - ListOnly: 一覧のみ（カレンダー非表示）
   ========================================================== */
function setTabActive(mode){
  const tabCal  = document.getElementById('tabCalendar');
  const tabList = document.getElementById('tabList');

  if(mode === 'calendar'){
    tabCal.classList.add('tab-btn-active');
    tabList.classList.remove('tab-btn-active');
    document.getElementById('calendarWrapper').classList.remove('hidden');
    viewMode = 'calendar';
  }else{
    tabCal.classList.remove('tab-btn-active');
    tabList.classList.add('tab-btn-active');
    document.getElementById('calendarWrapper').classList.add('hidden');
    viewMode = 'listOnly';
  }
}

document.getElementById('tabCalendar').addEventListener('click', ()=> setTabActive('calendar'));
document.getElementById('tabList').addEventListener('click', ()=> setTabActive('list'));

/* ==========================================================
   10) パスワード表示切替（確実に動く）
   ========================================================== */
document.getElementById('showPwd').addEventListener('change', (e)=>{
  const pwd = document.getElementById('pwd');
  pwd.type = e.target.checked ? 'text' : 'password';
});

function refreshAssignments(){
  if(!currentStudent) return;
  loadAssignments();
}

/* ==========================================================
   11) 起動時：セッション復帰（保存済みならログイン画面を飛ばす）
   ========================================================== */
(function boot(){
  // デフォは Calendar表示
  setTabActive('calendar');

  const saved = loadSession();
  if(!saved) return;

  currentStudent = saved;
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('portalCard').classList.remove('hidden');

  const name  = saved.name || '';
  const sid   = saved.studentId || '';
  const grade = saved.grade || saved.学年 || '';
  const cls   = saved.class || saved.クラス || '';

  document.getElementById('studentInfo').textContent =
    `${name} さん（ID: ${sid} / 学年: ${grade || '-'} / クラス: ${cls || '-'})`;

  initCalendarState();
  loadAssignments();
})();
</script>

</body>
</html>
