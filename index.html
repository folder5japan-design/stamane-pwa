<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタマネ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#020617;
  color:#e5e7eb;
}

.app{
  max-width:900px;
  margin:0 auto;
  padding:16px;
}

.card{
  background:#020617;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:16px;
}

/* ===== カレンダー ===== */

.calendar-wrapper{
  margin-top:8px;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:12px;
  overflow:hidden;
}

.cal-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.cal-weekdays,
.cal-row{
  display:flex;
  width:100%;
}

.cal-weekday,
.cal-cell{
  width:calc(100% / 7);   /* ★ これが決定打 */
  text-align:center;
  font-size:11px;
}

.cal-weekday{
  padding:4px 0;
  color:#9ca3af;
}

.cal-cell{
  min-height:70px;
  padding:4px;
  border-radius:8px;
  margin:1px;
  background:#020617;
}

.cal-cell-day{
  font-size:12px;
  font-weight:600;
}

.cal-has{ background:rgba(245,158,11,0.04); }
.cal-overdue{ background:rgba(248,113,113,0.07); }

</style>
</head>

<body>
<div class="app">
  <div class="card">
    <h1>スタマネ</h1>

    <div class="calendar-wrapper">
      <div class="cal-header">
        <div>2025年 1月</div>
      </div>

      <div class="cal-weekdays">
        <div class="cal-weekday">日</div>
        <div class="cal-weekday">月</div>
        <div class="cal-weekday">火</div>
        <div class="cal-weekday">水</div>
        <div class="cal-weekday">木</div>
        <div class="cal-weekday">金</div>
        <div class="cal-weekday">土</div>
      </div>

      <div class="cal-row">
        <div class="cal-cell cal-has"><div class="cal-cell-day">1</div></div>
        <div class="cal-cell"><div class="cal-cell-day">2</div></div>
        <div class="cal-cell"><div class="cal-cell-day">3</div></div>
        <div class="cal-cell"><div class="cal-cell-day">4</div></div>
        <div class="cal-cell"><div class="cal-cell-day">5</div></div>
        <div class="cal-cell"><div class="cal-cell-day">6</div></div>
        <div class="cal-cell"><div class="cal-cell-day">7</div></div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
