<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタマネ</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#020617;
  color:#e5e7eb;
}
.app{
  max-width:900px;
  margin:0 auto;
  padding:16px;
}
.card{
  background:#020617;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
h1{font-size:20px;margin:0 0 12px;}
label{font-size:14px;display:block;margin-top:8px;}
input{
  width:100%;padding:10px 12px;border-radius:999px;
  border:1px solid #374151;background:#020617;color:#f9fafb;
}
button{
  margin-top:12px;
  padding:10px 16px;
  border-radius:999px;
  border:none;
  cursor:pointer;
}
.btn-primary{background:#22c55e;color:#022c22;}
.btn-secondary{background:#111827;color:#e5e7eb;border:1px solid #374151;}
.meta{font-size:12px;color:#9ca3af;margin-top:4px;}
.hidden{display:none}

/* =====================
   タブ
===================== */
.view-tabs{
  display:inline-flex;
  border-radius:999px;
  padding:2px;
  background:#020617;
  border:1px solid #1f2937;
  margin:8px 0 4px;
}
.tab-btn{
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
  border:none;
  background:transparent;
  color:#9ca3af;
}
.tab-btn-active{
  background:#22c55e;
  color:#022c22;
}

/* =====================
   カレンダー（★修正版）
===================== */
.calendar-wrapper{
  margin-top:8px;
  border-radius:16px;
  border:1px solid #1f2937;
  padding:12px;
  overflow:hidden; /* ★ 左はみ出し防止 */
}
.cal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.cal-header-title{font-weight:600;}
.cal-nav-btn{
  background:#111827;
  color:#e5e7eb;
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  border:1px solid #374151;
}

/* ★ gapを使わない */
.cal-weekdays,
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:0;
  font-size:11px;
}

.cal-weekdays div{
  text-align:center;
  padding:4px 0;
  color:#9ca3af;
}

/* ★ marginで余白を作る */
.cal-cell{
  min-height:70px;
  padding:4px;
  margin:1px;                 /* ← これが効く */
  border-radius:8px;
  border:1px solid transparent;
  font-size:11px;
  cursor:pointer;
}
.cal-cell-empty{
  cursor:default;
  color:#6b7280;
}
.cal-cell-day{
  font-size:12px;
  font-weight:600;
  margin-bottom:2px;
}
.cal-cell-hover:hover{
  border-color:#374151;
}
.cal-overdue{background:rgba(248,113,113,0.07);}
.cal-submitted{background:rgba(74,222,128,0.05);}
.cal-has{background:rgba(245,158,11,0.04);}
.cal-selected{
  border-color:#22c55e;
  box-shadow:0 0 0 1px rgba(34,197,94,0.4);
}

/* =====================
   スマホ調整
===================== */
@media (max-width:768px){
  body{font-size:16px}
  button{width:100%}
}
</style>
</head>

<body>
<div class="app">

<div class="card">
  <h1>スタマネ</h1>
  <div class="calendar-wrapper">
    <div class="cal-header">
      <button class="cal-nav-btn">＜ 前</button>
      <div class="cal-header-title">2025年 1月</div>
      <button class="cal-nav-btn">次 ＞</button>
    </div>
    <div class="cal-weekdays">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="cal-grid">
      <!-- 日付セル -->
      <div class="cal-cell cal-cell-empty"></div>
      <div class="cal-cell cal-cell-hover">
        <div class="cal-cell-day">1</div>
      </div>
      <div class="cal-cell cal-cell-hover">
        <div class="cal-cell-day">2</div>
      </div>
    </div>
  </div>
</div>

</div>
</body>
</html>
